[workspace]
resolver = "3"
members = [
    "machine",
    "backend",
    "dynarmicsys",
    "linker",
    "kernel",
    "javavm",
    "java",
    "device",
    "inspect",
    "runtime",
    "tools/backendbench",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
publish = false

[workspace.dependencies]
thiserror = "2"
memchr = "2"
machine = { path = "machine" }
backend = { path = "backend" }
dynarmicsys = { path = "dynarmicsys" }
linker = { path = "linker" }
kernel = { path = "kernel" }
javavm = { path = "javavm" }
java = { path = "java" }
device = { path = "device" }
inspect = { path = "inspect" }

[profile.release]
debug = "line-tables-only"
lto = "fat"
codegen-units = 1

# Checks while working: the same optimized code without whole-program LTO,
# rebuilt incrementally.
[profile.fast]
inherits = "release"
debug = false
lto = false
codegen-units = 256
incremental = true
