[package]
name = "backend"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true
machine.workspace = true
dynarmicsys = { workspace = true, optional = true }
unicorn-engine = { version = "2.1", optional = true, default-features = false, features = ["arch_arm", "arch_aarch64"] }

[features]
default = ["dynarmic"]
dynarmic = ["dep:dynarmicsys"]
# GPL-2.0: local parity runs only, never enabled in a distributed build.
unicorn = ["dep:unicorn-engine"]
